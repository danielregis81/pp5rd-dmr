<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formatador de DMR ID - PP5RD</title>
<style>
  :root { --azul:#305496; --azul2:#0a66c2; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; background:#f4f6f9;
         color:#222; margin:0; padding:0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 18px 60px; }
  h1 { color:var(--azul); font-size: 1.7rem; margin: 6px 0 2px; }
  .sub { color:#555; font-size:.95rem; margin:0 0 2px; }
  a { color: var(--azul2); }
  .card { background:#fff; border:1px solid #e3e7ee; border-radius:10px;
          padding:20px; margin-top:18px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  label { font-weight:600; display:block; margin-bottom:8px; }
  input[type=file], select { width:100%; padding:10px; border:1px solid #b7c0d0;
                     border-radius:8px; background:#fafbfd; }
  input[type=file] { border-style:dashed; }
  button { width:100%; margin-top:16px; padding:14px; font-size:1rem; font-weight:700;
           color:#fff; background:var(--azul); border:none; border-radius:8px; cursor:pointer; }
  button:disabled { background:#9fb0cc; cursor:not-allowed; }
  #log { margin-top:16px; background:#0f1115; color:#cfe3ff; font-family:Consolas,monospace;
         font-size:.82rem; padding:12px; border-radius:8px; height:160px; overflow:auto;
         white-space:pre-wrap; }
  .footer { text-align:center; margin-top:22px; color:#777; font-size:.88rem; }
  .footer .call { color:var(--azul); font-weight:700; }
  .status { font-size:.9rem; color:#555; margin-top:10px; }
  .ok { color:#1e7a34; font-weight:600; }
  .uilang { text-align:right; font-size:.85rem; }
  .uilang select { width:auto; display:inline-block; padding:4px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="uilang">
    <label for="uiLang" style="display:inline; font-weight:400;" data-i18n="uiLangLabel">Idioma / Language:</label>
    <select id="uiLang">
      <option value="pt" selected>Portugues</option>
      <option value="en">English</option>
    </select>
  </div>

  <h1 data-i18n="title">Formatador de DMR ID</h1>
  <p class="sub" data-i18n="sub1"></p>
  <p class="sub" data-i18n="sub2"></p>

  <div class="card">
    <label for="arquivo" data-i18n="fileLabel"></label>
    <input type="file" id="arquivo" accept=".csv,.txt">

    <label for="idioma" style="margin-top:14px;" data-i18n="countryLangLabel"></label>
    <select id="idioma">
      <option value="pt" selected data-i18n="optPt"></option>
      <option value="en" data-i18n="optEn"></option>
    </select>

    <button id="gerar" disabled data-i18n="btnLoading"></button>
    <div class="status" id="status" data-i18n="statusInit"></div>
    <div id="log"></div>
  </div>

  <p class="sub" style="text-align:center; margin-top:16px;">
    <span data-i18n="winPrompt"></span>
    <a href="https://github.com/danielregis81/pp5rd-dmr/releases/latest/download/FormatadorDMR.exe" data-i18n="winLink"></a>
  </p>

  <div class="footer">
    <span class="call">PP5RD</span> &middot;
    <a href="mailto:contato@pp5rd.com.br">contato@pp5rd.com.br</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script src="app.js?v4"></script>
</body>
</html>
